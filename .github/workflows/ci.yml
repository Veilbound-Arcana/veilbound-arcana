name: Veilbound Arcana CI

on:
  push:
    branches: [ main, "item/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  offline-evidence-check:
    name: Offline Replay & KPI Evidence Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Offline Match Replay (Judges Test)
        run: node scripts/demo-replay.mjs

      - name: Run Claims & KPI Verification
        run: node scripts/verify-claims.mjs

  contracts-test:
    name: Contracts Unit Tests (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: contracts/package.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Hardhat Tests
        run: npx hardhat test
