      <stop offset="0%" stop-color="#0A0714"></stop>
      <stop offset="55%" stop-color="#150F28"></stop>
      <stop offset="100%" stop-color="#8C96A5" stop-opacity="0.55"></stop>
    </linearGradient>
    <radialGradient id="va-halo-c064" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C3CCDA" stop-opacity="0.55"></stop>
