      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="45%" stop-color="#E8EDF5"></stop>
      <stop offset="100%" stop-color="#8C96A5"></stop>
    </radialGradient>
    <filter id="va-glow-c064" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="b" operator="over"></feComposite>
    </filter>
