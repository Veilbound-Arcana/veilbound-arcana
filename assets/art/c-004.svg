      <stop offset="0%" stop-color="#0A0714"></stop>
      <stop offset="55%" stop-color="#150F28"></stop>
      <stop offset="100%" stop-color="#F2C21B" stop-opacity="0.55"></stop>
    </linearGradient>
    <radialGradient id="va-halo-c004" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE45C" stop-opacity="0.55"></stop>
      <stop offset="60%" stop-color="#FFE45C" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#FFE45C" stop-opacity="0"></stop>
