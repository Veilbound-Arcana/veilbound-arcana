      <stop offset="45%" stop-color="#E8EDF5"></stop>
      <stop offset="100%" stop-color="#8C96A5"></stop>
    </radialGradient>
    <filter id="va-glow-c007" x="-40%" y="-40%" width="180%" height="180%">
